name: AgentBoard Build

on:
  push:
    tags:
      - 'agentboard-v*'
  workflow_dispatch: # build without a tag (the release job then skips)

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Test
        run: |
          npm run test:js
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build (Windows)
        run: npx tauri build

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # bundle targets = nsis, msi (tauri.conf.json): fail when either is missing
          cp src-tauri/target/release/bundle/nsis/*.exe artifacts/
          cp src-tauri/target/release/bundle/msi/*.msi artifacts/

      - uses: actions/upload-artifact@v6
        with:
          name: agentboard-windows
          path: artifacts/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: AgentBoard ${{ github.ref_name }}
          files: artifacts/*
